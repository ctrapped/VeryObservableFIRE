# Continuous integration: lint and test every push and pull request on GitHub's machines.
# Results show as a check mark next to each commit/PR, and as the README badge.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4  # reuse the hook environments pre-commit builds
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure  # same hooks and versions as local commits

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # finish every Python version even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,fits]"
      - run: pytest
