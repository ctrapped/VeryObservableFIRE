# Checks run automatically on every `git commit` (set up once with `pre-commit install`).
# Run on the whole repo with `pre-commit run --all-files`; update pinned versions with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files  # blocks accidentally committing simulation outputs (e.g. .hdf5)
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check  # lint, using the rules in pyproject.toml
        args: ["--fix"]
      - id: ruff-format
